name: Backend checks

on:
  push:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/backend.yml
  pull_request:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/backend.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./pkg/...
      - run: go test -race ./pkg/... -timeout 3m
      - name: TCP and UDP through local Tailscale nodes
        run: go test -race -tags=integration ./pkg/router -run TestTailscaleProxyIntegration -timeout 90s
